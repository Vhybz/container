<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Container Multi-Business Management System for Pharmacy, Barbershop, Tech & Retail">

  <!-- Mobile & PWA Theme Colors -->
  <meta name="theme-color" content="#2563EB">
  <meta name="background-color" content="#0F172A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Container POS">
  <link rel="apple-touch-icon" href="app_logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>

  <title>Container Multi-Business Stores</title>
  <link rel="manifest" href="manifest.json">

  <!-- PWA Service Worker & Install Prompt Interceptor JS -->
  <script>
    let deferredInstallPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      window.dispatchEvent(new CustomEvent('pwaCanInstall'));
      console.log('[PWA] beforeinstallprompt event captured.');
    });

    window.checkPwaCanInstall = function() {
      return deferredInstallPrompt !== null;
    };

    window.promptPwaInstallation = function() {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('[PWA] User accepted the install prompt');
          } else {
            console.log('[PWA] User dismissed the install prompt');
          }
          deferredInstallPrompt = null;
        });
      }
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(registration) {
          console.log('[PWA] Service Worker registered with scope:', registration.scope);
        }, function(err) {
          console.error('[PWA] Service Worker registration failed:', err);
        });
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
