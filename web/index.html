<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Container Multi-Business Management System for Pharmacy, Barbershop, Tech & Retail">

  <!-- Mobile & PWA Theme Colors -->
  <meta name="theme-color" content="#2563EB">
  <meta name="background-color" content="#0F172A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Container POS">
  <link rel="apple-touch-icon" href="app_logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>

  <!-- Hide Netlify Toolbar / Floating Drawer Banner -->
  <style>
    netlify-drawer,
    netlify-toolbar,
    [data-netlify-drawer],
    #netlify-drawer,
    .netlify-drawer,
    .netlify-toolbar,
    iframe[src*="netlify"],
    [id*="netlify-drawer"],
    [class*="netlify-drawer"],
    [id*="netlify-toolbar"],
    [class*="netlify-toolbar"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      position: absolute !important;
      top: -9999px !important;
      left: -9999px !important;
    }
  </style>

  <!-- PWA Service Worker & Install Prompt Interceptor JS -->
  <script>
    // MutationObserver to permanently remove any injected Netlify Drawer / Toolbar element
    const removeNetlifyDrawer = () => {
      const selectors = [
        'netlify-drawer',
        'netlify-toolbar',
        '[data-netlify-drawer]',
        '#netlify-drawer',
        '.netlify-drawer',
        'iframe[src*="netlify"]'
      ];
      selectors.forEach(selector => {
        document.querySelectorAll(selector).forEach(el => el.remove());
      });
    };

    const netlifyObserver = new MutationObserver(() => {
      removeNetlifyDrawer();
    });

    document.addEventListener('DOMContentLoaded', () => {
      removeNetlifyDrawer();
      if (document.body) {
        netlifyObserver.observe(document.body, { childList: true, subtree: true });
      }
    });

    let pwaDeferredPrompt = null;

    // Intercept browser default prompt and hold event
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      pwaDeferredPrompt = e;
      console.log('[PWA] beforeinstallprompt event intercepted.');
      window.dispatchEvent(new CustomEvent('pwa_install_ready'));
    });

    // Helper function for Flutter to check if PWA can be installed
    window.checkPwaCanInstall = function() {
      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
        return false;
      }
      return pwaDeferredPrompt !== null;
    };

    // Helper function for Flutter to trigger native install popup
    window.promptPwaInstallation = async function() {
      if (pwaDeferredPrompt) {
        pwaDeferredPrompt.prompt();
        const choice = await pwaDeferredPrompt.userChoice;
        pwaDeferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa_install_ready'));
        return choice.outcome === 'accepted';
      }
      return false;
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(registration) {
          console.log('[PWA] Service Worker registered with scope:', registration.scope);
        }, function(err) {
          console.error('[PWA] Service Worker registration failed:', err);
        });
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
